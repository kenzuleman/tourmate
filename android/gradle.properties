# Keep heap below physical RAM (this machine ~7 GB); 8G Xmx caused Gradle daemon crashes.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
# Fewer parallel workers reduces native RAM spikes on low-memory PCs (fixes post-build daemon crashes).
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
